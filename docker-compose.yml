services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    image: elabel:latest
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  uploads:
